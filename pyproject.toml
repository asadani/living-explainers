[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-explainers"
version = "0.1.0"
description = "Explore a source-linked model of a system."
requires-python = ">=3.11"
authors = [{name = "Anuj Sadani"}]
readme = "README.md"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
living-explainers = "living_explainers.__main__:main"

[tool.setuptools.packages.find]
include = ["living_explainers*"]

[tool.setuptools.package-data]
"*" = ["web/*.css", "web/*.js", "assets/*.css", "assets/*.js", "*.css", "*.js", "*.json"]
